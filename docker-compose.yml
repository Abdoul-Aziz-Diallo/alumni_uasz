services:
  frontend:
    build:
      context: .
      dockerfile: infrastructure/docker/frontend.Dockerfile
    volumes:
      - ./frontend:/workspace/frontend
      - frontend_node_modules:/workspace/frontend/node_modules
    expose:
      - "5173"

  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/backend.Dockerfile
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: database
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:-alumni_uasz}
      DB_USERNAME: ${DB_USERNAME:-alumni}
      DB_PASSWORD: ${DB_PASSWORD:-local_dev_only}
    depends_on:
      database:
        condition: service_healthy
    expose:
      - "8000"

  database:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-alumni_uasz}
      MYSQL_USER: ${DB_USERNAME:-alumni}
      MYSQL_PASSWORD: ${DB_PASSWORD:-local_dev_only}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-local_root_dev_only}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  frontend_node_modules:
  mysql_data:
